[project]
name = "phd-app"
version = "0.1.0"
description = "自动化博士申请辅助系统"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.122.0",
    "uvicorn>=0.38.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "aiohttp>=3.9.0",
    "pyyaml>=6.0.0",
    "openai>=1.0.0",
    "langchain-community>=0.4.0",
    "crawl4ai>=0.7.0",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.28.0",
]

[tool.uv]
python-downloads = "manual"

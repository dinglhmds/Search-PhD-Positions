
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhD Application Helper</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet">
</head>
<body>
    <div class="header-section">
        <div class="container">
            <div class="text-center">
                <h1 class="display-4">PhD Application Helper</h1>
                <p class="lead">Find and explore faculty information for your PhD applications</p>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card p-4">
                    <h3 class="text-center mb-4">Enter University Information</h3>
                    <form id="universityForm">
                        <div class="mb-3">
                            <label for="university" class="form-label">University Name or Abbreviation</label>
                            <input type="text" class="form-control search-input" id="university" name="university" placeholder="e.g., UMD, University of Maryland" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-search"></i> Start Processing
                            </button>
                        </div>
                    </form>
                </div>

                <div id="processingSection" class="d-none">
                    <h4 class="mt-4">Processing Steps</h4>
                    <div class="processing-steps">
                        <div class="processing-step">
                            <div class="step-circle active" id="step1">1</div>
                            <div class="step-label active" id="label1">University Normalization</div>
                        </div>
                        <div class="processing-step">
                            <div class="step-circle" id="step2">2</div>
                            <div class="step-label" id="label2">Searching Faculty Pages</div>
                        </div>
                        <div class="processing-step">
                            <div class="step-circle" id="step3">3</div>
                            <div class="step-label" id="label3">Crawling Faculty Info</div>
                        </div>
                        <div class="processing-step">
                            <div class="step-circle" id="step4">4</div>
                            <div class="step-label" id="label4">Parsing Information</div>
                        </div>
                    </div>
                    
                    <div class="card result-card">
                        <div class="card-body">
                            <h5>Progress</h5>
                            <div class="progress mb-3">
                                <div id="progressBar" class="progress-bar" role="progressbar" style="width: 0%"></div>
                            </div>
                            <div id="statusText" class="text-muted">Initializing...</div>
                        </div>
                    </div>
                </div>

                <div id="resultsSection" class="d-none">
                    <h4 class="mt-4">Results</h4>
                    <div id="resultsContent"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('universityForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const university = formData.get('university');
            
            // Show processing section
            document.getElementById('processingSection').classList.remove('d-none');
            document.getElementById('resultsSection').classList.add('d-none');
            
            // Reset progress
            document.querySelectorAll('.step-circle, .step-label').forEach(el => {
                el.classList.remove('active');
            });
            document.getElementById('step1').classList.add('active');
            document.getElementById('label1').classList.add('active');
            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('statusText').textContent = 'Starting process...';
            
            try {
                // Start the processing
                const response = await fetch('/process', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ university: university })
                });
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    buffer += decoder.decode(value, { stream: true });
                    
                    // Process each line separately
                    const lines = buffer.split('\n');
                    buffer = lines.pop(); // Keep last incomplete line in buffer
                    
                    for (const line of lines) {
                        if (line.trim()) {
                            try {
                                const data = JSON.parse(line);
                                
                                // Update progress
                                if (data.type === 'progress') {
                                    const step = data.step;
                                    const percentage = data.percentage;
                                    const status = data.status;
                                    
                                    // Update step indicators
                                    for (let i = 1; i <= 4; i++) {
                                        const stepEl = document.getElementById(`step${i}`);
                                        const labelEl = document.getElementById(`label${i}`);
                                        
                                        if (i <= step) {
                                            stepEl.classList.add('active');
                                            labelEl.classList.add('active');
                                        } else {
                                            stepEl.classList.remove('active');
                                            labelEl.classList.remove('active');
                                        }
                                    }
                                    
                                    document.getElementById('progressBar').style.width = `${percentage}%`;
                                    document.getElementById('statusText').textContent = status;
                                }
                                
                                // Show results when complete
                                if (data.type === 'results') {
                                    displayResults(data.results);
                                }
                            } catch (e) {
                                console.error('Error parsing line:', e);
                            }
                        }
                    }
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('statusText').textContent = 'Error occurred: ' + error.message;
            }
        });
        
        function displayResults(results) {
            document.getElementById('resultsSection').classList.remove('d-none');
            
            let html = '';
            
            // Show search results
            if (results.search_results && results.search_results.length > 0) {
                html += '<div class="card mb-3"><div class="card-body">';
                html += '<h5>Search Results</h5>';
                results.search_results.forEach((result, index) => {
                    html += `<div class="p-2 border-bottom">
                        <h6>${result.title}</h6>
                        <p class="mb-1"><a href="${result.url}" target="_blank">${result.url}</a></p>
                        <p class="text-muted">${result.snippet}</p>
                    </div>`;
                });
                html += '</div></div>';
            }
            
            // Show faculty data
            if (results.faculty_data && results.faculty_data.length > 0) {
                html += '<div class="card"><div class="card-body">';
                html += `<h5>Faculty Information (${results.faculty_data.length} found)</h5>`;
                
                results.faculty_data.forEach(faculty => {
                    html += '<div class="faculty-card">';
                    html += '<div class="faculty-header">';
                    html += `<div class="faculty-name">${faculty.name}</div>`;
                    html += `<div class="faculty-title">${faculty.title}</div>`;
                    html += '</div>';
                    html += '<div class="faculty-content">';
                    html += `<div class="faculty-email"><i class="fas fa-envelope"></i> ${faculty.email}</div>`;
                    if (faculty.research_areas && faculty.research_areas.length > 0) {
                        html += '<div class="research-areas"><strong>Research Areas:</strong> ';
                        faculty.research_areas.forEach(area => {
                            if (area !== '未提供') {
                                html += `<span class="research-tag">${area}</span>`;
                            }
                        });
                        html += '</div>';
                    }
                    html += '</div></div></div>';
                });
                
                html += '</div></div>';
            }
            
            document.getElementById('resultsContent').innerHTML = html;
        }
    </script>
</body>
</html>
